name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure AKS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-portfolio-eastus
          cluster-name: aks-portfolio-eastus

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
         version: 'latest'

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Set image name
        run: |
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/web-app:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Deploy application
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" kubernetes/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml

      - name: Apply Kubernetes Service
        run: kubectl apply -f kubernetes/load-balancer.yaml

      - name: Wait for deployment
        run: kubectl rollout status deployment/web-app-deployment --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc web-app-load-balancer

      - name: Deployment summary
        run: |
            echo "Successfully deployed: ${IMAGE}"